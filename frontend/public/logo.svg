    <filter id="jk-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".55" stdDeviation=".65" flood-color="#020817" flood-opacity=".34"/>
